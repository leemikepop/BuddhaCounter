name: Build iOS & Deploy to TestFlight

on:
  push: # 每次 push (任何分支或標籤) 都自動觸發
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵觸發建置

permissions:
  contents: write

jobs:
  build-and-deploy-ios:
    name: Build iOS & Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'buddha-counter-temp-pwd' }}
        run: |
          # 1. 建立暫存路徑
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 2. Base64 解碼還原為檔案
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # 3. 建立並解鎖暫存 Keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 4. 匯入 p12 憑證至 Keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 5. 安裝 Provisioning Profile 到系統目錄
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          
          # 同時依 UUID 複製一份以確保 Xcode 絕對能精確匹配
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH) || true)
          if [ -n "$PROFILE_UUID" ]; then
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          fi

      - name: Build iOS IPA (App Store Distribution)
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          
          # 將產出的 .ipa 整理至標準路徑
          mkdir -p build/ios/ipa
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            cp "$IPA_FILE" build/ios/ipa/BuddhaCounter.ipa
            echo "IPA 成功生成: build/ios/ipa/BuddhaCounter.ipa"
          else
            echo "錯誤：未找到 .ipa 檔案"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddhaCounter-iOS-Signed-IPA
          path: build/ios/ipa/BuddhaCounter.ipa
          retention-days: 14

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: 'build/ios/ipa/BuddhaCounter.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      # 只有推送 tag (如 v1.48.0) 或發布 Release 時，將 IPA 附加到該 GitHub Release
      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/BuddhaCounter.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
