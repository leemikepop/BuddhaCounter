name: iOS CI - Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-ios:
    name: Verify & Build iOS (CI Only)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract App Version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '\r' | tr -d ' ')
          VERSION_NAME=$(echo "$VERSION" | cut -d '+' -f 1)
          VERSION_CODE=$(echo "$VERSION" | cut -s -d '+' -f 2)
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="1"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Extracted App Version: $VERSION (Name: $VERSION_NAME, Code: $VERSION_CODE)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build iOS (No Codesign Check)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y "BuddhaCounter-v${VERSION_NAME}+${VERSION_CODE}.ipa" Payload
          echo "IPA 成功封裝: build/ios/ipa/BuddhaCounter-v${VERSION_NAME}+${VERSION_CODE}.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}-iOS-IPA
          path: build/ios/ipa/BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}.ipa
          retention-days: 14
