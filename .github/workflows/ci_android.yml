name: Android CI - Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否直接建立/更新 GitHub Release (附帶 APK / AAB 檔案)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract App Version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '\r' | tr -d ' ')
          VERSION_NAME=$(echo "$VERSION" | cut -d '+' -f 1)
          VERSION_CODE=$(echo "$VERSION" | cut -s -d '+' -f 2)
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="1"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Extracted App Version: $VERSION (Name: $VERSION_NAME, Code: $VERSION_CODE)"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Prepare Android Signing & Keystores
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
          cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore || true

      - name: Build APK (Release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build App Bundle (AAB for Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Prepare Versioned Artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/BuddhaCounter-v${VERSION_NAME}+${VERSION_CODE}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "build/app/outputs/bundle/release/BuddhaCounter-v${VERSION_NAME}+${VERSION_CODE}.aab"
          echo "APK: build/app/outputs/flutter-apk/BuddhaCounter-v${VERSION_NAME}+${VERSION_CODE}.apk"
          echo "AAB: build/app/outputs/bundle/release/BuddhaCounter-v${VERSION_NAME}+${VERSION_CODE}.aab"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}-Android-APK
          path: build/app/outputs/flutter-apk/BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}.apk
          retention-days: 14

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}-GooglePlay-AAB
          path: build/app/outputs/bundle/release/BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}.aab
          retention-days: 14

      # 只有推送 tag (如 v1.48.0)、發布 Release、或手動勾選 create_release 時，才會發布正式 GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/flutter-apk/BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}.apk
            build/app/outputs/bundle/release/BuddhaCounter-v${{ env.VERSION_NAME }}+${{ env.VERSION_CODE }}.aab
          generate_release_notes: true
          draft: false
          prerelease: false
