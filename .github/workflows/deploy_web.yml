name: Web - Deploy to GitHub Pages

# 推送版號 tag (v*) 時與 Android / iOS 一起發布；也可以手動執行。
# 需要先在 Settings → Pages 把 Source 設成「GitHub Actions」(免費帳號的 repo 必須是公開的)。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# 建置工作 (會執行第三方 action 與套件) 只有讀取權限；寫入 Pages 的權限只給 deploy 工作
permissions:
  contents: read

# 同時只跑一次部署；新的部署開始時不取消正在進行的那一次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        # 第三方 action 固定在 commit SHA，避免 tag 被改指向惡意程式碼
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # 網址是 https://<帳號>.github.io/<repo>/，所以 base href 要帶 repo 名稱
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
