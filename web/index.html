<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!--
    base href 由 `flutter build web --base-href /BuddhaCounter/` 代入 (GitHub Pages 的子路徑)。
    本機 `flutter run -d chrome` 時是 "/"。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="念佛、拜佛的隨身計數工具：點擊計數、隨佛曲自動計數、迴向與每日功課月曆。">
  <meta name="theme-color" content="#8C5E32">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="念佛計數器">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>念佛計數器</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FAF7F2; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: #8C5E32; transition: opacity .3s;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 16px; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #131418; }
      #loading { color: #DDB66B; }
    }
  </style>
</head>
<body>
  <!-- 第一次開啟要下載程式與繪圖引擎，畫出第一個畫面前先顯示這個 -->
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div>南無阿彌陀佛</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
