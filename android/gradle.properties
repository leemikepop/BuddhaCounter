org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true

# AGP 9 built-in Kotlin (needs Flutter 3.47+). app/build.gradle.kts does not apply kotlin-android;
# home_widget / package_info_plus only apply KGP when this is false.
android.builtInKotlin=true
# Flutter Gradle Plugin still needs the old AGP DSL types
android.newDsl=false

