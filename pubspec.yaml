name: buddha_counter
description: 念佛計數器
publish_to: 'none'
version: 1.49.0+149

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  provider: ^6.1.2
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3   # <--- 新增這行

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
